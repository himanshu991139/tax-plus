    <div class="login-wrapper">
      <div class="background-decorations">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="grid-overlay"></div>
      </div>

      <div class="login-container">
        <!-- Login Card -->
        <div class="login-card">
          <!-- Gradient top border accent -->
          <div class="card-accent-border"></div>

          <div class="card-body">
            <!-- Header Icon Area -->
            <div class="icon-area">
              <div class="icon-glow-dot dot-bottom-left"></div>
              <div class="icon-glow-dot dot-top-right"></div>
              <div class="icon-mark">
                <div class="icon-circle">
                  <svg viewBox="0 0 24 24" class="checkmark-svg" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12.5l4 4 8-10" />
                  </svg>
                </div>
              </div>
            </div>

            <!-- Title -->
            <h1 class="brand-title">MyEcom<span class="highlight">GST</span></h1>

            <!-- Subtitle -->
            <p class="brand-subtitle">
              Seamlessly convert multi-channel e-commerce sales
              and return reports into GSTR-1 filings.
            </p>

            <!-- Primary Action Button -->
            <button class="google-login-btn" (click)="signInWithGoogle()" [disabled]="isRedirecting()">
              @if (isRedirecting()) {
                <span class="btn-spinner"></span>
                <span class="btn-text">Redirecting to Google...</span>
              } @else {
                <svg class="google-icon" viewBox="0 0 24 24">
                  <path
                    fill="#4285F4"
                    d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                  />
                  <path
                    fill="#34A853"
                    d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                  />
                  <path
                    fill="#FBBC05"
                    d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"
                  />
                  <path
                    fill="#EA4335"
                    d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"
                  />
                </svg>
                <span class="btn-text">Continue with Google</span>
              }
            </button>

            <!-- Feature Badges Section -->
            <div class="divider"></div>
            <div class="feature-badges">
              <div class="feature-item">
                <svg viewBox="0 0 24 24" class="feature-icon shield-icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 3a1 1 0 0 1 1 1v3a1 1 0 0 1-2 0V4a1 1 0 0 1 1-1zM5 11l7-4 7 4v6a4 4 0 0 1-8 0v-2z" />
                  <path d="M9 12l2 2 4-4" />
                </svg>
                <span>GST Portal Compliant</span>
              </div>
              <div class="feature-item">
                <svg viewBox="0 0 24 24" class="feature-icon lightning-icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M13 2L3 14h7l-1 8 12-12h-7l1-8z" />
                </svg>
                <span>Auto Reconciled</span>
              </div>
            </div>

            <!-- Footer / Coverage Section -->
            <div class="divider"></div>
            <div class="coverage-section">
              <span class="coverage-label">COVERAGE</span>
              <div class="coverage-pills">
                <span class="coverage-pill coverage-pill-solid">
                  <span class="pill-dot dot-purple"></span>
                  All Online Marketplaces
                </span>
                <span class="coverage-pill coverage-pill-outline">
                  <span class="pill-dot dot-cyan"></span>
                  Direct CSV / Excel
                </span>
              </div>
            </div>
          </div>
        </div>

        <!-- Footer / Notice -->
        <div class="login-footer">
          <p>© 2026 MyEcomGST. All rights reserved.</p>
        </div>
      </div>
    </div>
