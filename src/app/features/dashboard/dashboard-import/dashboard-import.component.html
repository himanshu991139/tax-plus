    <div class="dashboard-import-page">
      <!-- Client Header Bar -->
      <app-client-header></app-client-header>

      @if (state.clientInfo().filingType === 'Quarterly') {
        <div class="alert alert-warning border border-warning-subtle d-flex align-items-center justify-content-between mb-4 py-2 px-3 rounded-3 shadow-sm" role="status">
          <div class="d-flex align-items-center gap-2">
            <app-icon name="layers" [size]="18" class="text-warning-emphasis flex-shrink-0"></app-icon>
            <span class="small text-warning-emphasis">
              <strong>Quarterly Filing (QRMP Scheme) Active:</strong> Return period is <strong>{{ state.clientInfo().period }}</strong>. Uploaded sales &amp; returns will be consolidated across all 3 months of the quarter into GSTR-1.
            </span>
          </div>
          @if (state.activeProfile(); as activeP) {
            <button type="button" class="btn btn-sm btn-outline-dark text-nowrap ms-3" (click)="state.openClientInfoModal(activeP)">
              Switch Period
            </button>
          }
        </div>
      }

      <!-- Platform Cards Grid -->
      <app-platform-grid></app-platform-grid>

      <!-- Modals -->
      <app-upload-modal></app-upload-modal>
      <app-statement-modal></app-statement-modal>
    </div>
